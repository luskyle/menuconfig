name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: 打包并发布 ${{ github.ref_name }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: 安装依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libncurses-dev ninja-build

      - name: 配置（Release）
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: 构建
        run: cmake --build build

      - name: 回归测试（conf 非交互）
        run: |
          mkdir -p /tmp/smoke
          cd /tmp/smoke
          "$GITHUB_WORKSPACE/build/conf" --alldefconfig "$GITHUB_WORKSPACE/test/rootconf"
          test -s sdkconfig
          grep -q 'CONFIG_GEN_CHOICE1=y' sdkconfig

      - name: 打包
        run: |
          VER="${GITHUB_REF_NAME#v}"
          STAGE="menuconfig-${VER}"
          mkdir -p "dist/${STAGE}"
          cp build/mconf build/conf "dist/${STAGE}/"
          cp README.md README.en.md LICENSE "dist/${STAGE}/"
          tar -C dist -czf "${STAGE}-linux-x86_64.tar.gz" "${STAGE}"
          sha256sum "${STAGE}-linux-x86_64.tar.gz" > "${STAGE}-linux-x86_64.tar.gz.sha256"

      - name: 创建 GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER="${GITHUB_REF_NAME#v}"
          ASSETS=(
            "menuconfig-${VER}-linux-x86_64.tar.gz"
            "menuconfig-${VER}-linux-x86_64.tar.gz.sha256"
          )
          # 优先用仓库里写好的详细说明, 找不到再退回按提交自动生成
          if [ -f "release-notes/${GITHUB_REF_NAME}.md" ]; then
            echo "使用 release-notes/${GITHUB_REF_NAME}.md 作为发布说明"
            gh release create "${GITHUB_REF_NAME}" "${ASSETS[@]}" \
              --title "menuconfig++ ${VER}" \
              --notes-file "release-notes/${GITHUB_REF_NAME}.md"
          else
            echo "未找到 release-notes/${GITHUB_REF_NAME}.md, 退回自动生成"
            gh release create "${GITHUB_REF_NAME}" "${ASSETS[@]}" \
              --title "menuconfig++ ${VER}" \
              --generate-notes
          fi